# Example: add this to a dashboard (Edit -> Add card -> Manual).
# Requires the resource /hacsfiles/froeling-gamma-card/froeling-gamma-card.js (JavaScript module)
# or, when copied manually to config/www/: /local/froeling-gamma-card.js

type: custom:froeling-gamma-card
title: Verwarming
show_tiles: true
entities:
  outside: sensor.gamma_outside_temperature
  boiler: sensor.gamma_boiler_temperature
  flow: sensor.gamma_heating_flow_temperature
  room: sensor.gamma_room_temperature
  room_target: sensor.gamma_room_target_temperature
  hot_water_target: sensor.gamma_hot_water_target
  mode: sensor.gamma_operating_mode
  flame: binary_sensor.gamma_flame_request
  # Optional, once the UVS 42 is in HA through a DL interface:
  # buffer_top: sensor.uvs42_t3
  # buffer_bottom: sensor.uvs42_t2
  # hot_water: sensor.uvs42_t4
  # boiler_pump: binary_sensor.uvs42_a1
  # hot_water_pump: binary_sensor.uvs42_a2
thresholds:
  flow_active: 28     # °C flow temperature above which the heating circuit is drawn as active
  boiler_active: 60   # °C boiler temperature above which fire/smoke and the charging pump are drawn (when no pump entity is set)
